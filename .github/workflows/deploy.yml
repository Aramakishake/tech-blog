name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - develop  # Hugoプロジェクトがあるブランチ

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      # Gitの差分において、日本語名ファイルだとdouble quoteで囲まれてしまう
      # そのとき、grepでの判定がうまくいかないため、Gitの設定を変更する
      - name: Configure Git
        run: |
          git config --global core.quotepath false

      # Debug用に差分を表示するステップを追加
      # - name: Debug Diff
      #   run: |
      #     echo "=== Changed Files ==="
      #     git diff --name-only HEAD^ HEAD

      #     echo ""
      #     echo "=== Full Diff ==="
      #     git diff HEAD^ HEAD
      #     echo "====test grep===="
      #     DIFF=$(git diff HEAD^ HEAD)
      #     if echo "$DIFF" | grep -q -- "-draft = true"; then
      #       echo "FOUND OLD"
      #     fi

      #     if echo "$DIFF" | grep -q -- "+draft = false"; then
      #       echo "FOUND NEW"
      #     fi
          
      - name: Detect Published Post
        id: detect_post
        shell: bash
        run: |
          NEW_POST=false

          FILES=$(git diff --name-only HEAD^ HEAD)

          for file in $FILES
          do
            # post配下のmarkdownだけ見る
            if [[ "$file" != content/post/*.md ]]; then
              continue
            fi

            DIFF=$(git diff HEAD^ HEAD -- "$file")

            OLD_DRAFT=$(git show HEAD^:"$file" 2>/dev/null | grep "^draft =" || true)
            NEW_DRAFT=$(grep "^draft =" "$file" || true)

            echo "OLD=$OLD_DRAFT"
            echo "NEW=$NEW_DRAFT"

            if [[ "$OLD_DRAFT" == *"true"* ]] &&
              [[ "$NEW_DRAFT" == *"false"* ]]; then

              echo "TARGET FILE=$file"

              grep "^title" "$file"

              TITLE=$(grep "^title =" "$file" \
                | head -n1 \
                | cut -d'=' -f2 \
                | tr -d '"' \
                | tr -d "'" \
                | xargs)

              echo "TITLE=$TITLE"

              echo "NEW_POST=true" >> $GITHUB_ENV
              echo "POST_TITLE=$TITLE" >> $GITHUB_ENV

              NEW_POST=true

              echo "Published Article: $TITLE"
              break
            fi
          done

          if [ "$NEW_POST" = false ]; then
            echo "NEW_POST=false" >> $GITHUB_ENV
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'  # Hugoのバージョン（必要に応じて変更）

      - name: Build site
        run: hugo

      - name: Show Published Article
        if: env.NEW_POST == 'true'
        run: |
          echo "New Article Published!"
          echo "Title: $POST_TITLE"

      - name: Get URL From RSS
        if: env.NEW_POST == 'true'
        shell: bash
        run: |
          LINK=$(grep -A 2 "$POST_TITLE" public/index.xml \
            | grep "<link>" \
            | head -n1 \
            | sed 's#.*<link>##' \
            | sed 's#</link>.*##')

          echo "POST_URL=$LINK" >> $GITHUB_ENV

          echo "URL=$LINK"

      - name: Generate Tweet Message
        if: env.NEW_POST == 'true'
        run: |
          echo ""
          echo "================================"
          echo "TWEET MESSAGE"
          echo "================================"
          echo "📝 新しい記事を公開しました！"
          echo ""
          echo "$POST_TITLE"
          echo ""
          echo "$POST_URL"
          echo ""
          echo "#技術ブログ #Hugo"
          echo "================================"

      # 記事情報を取得できているか確認
